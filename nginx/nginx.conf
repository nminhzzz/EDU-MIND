events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Cấu hình log định dạng chuẩn
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;
    gzip on;
    gzip_types application/json application/javascript text/css text/plain text/event-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # Cho phép tải file lên tới 50MB (PDF, Docx, Quiz attachments)
    client_max_body_size 50M;

    # Cấu hình Upstream
    upstream backend_servers {
        server backend:8000;
    }

    upstream frontend_servers {
        server frontend:3000;
    }

    # SERVER 1: Chuyển hướng HTTP (cổng 80) -> HTTPS (cổng 443)
    server {
        listen 80;
        server_name _;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # SERVER 2: Xử lý kết nối HTTPS bảo mật (cổng 443)
    server {
        listen 443 ssl;
        server_name _;

        # Chứng chỉ SSL tự ký cho môi trường localhost
        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Tối ưu hóa bảo mật
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

        # Detailed dependency errors belong to internal monitoring only.
        location = /health/detailed {
            return 404;
        }

        # 1. Định tuyến Next.js Frontend
        location / {
            proxy_pass http://frontend_servers;
            proxy_http_version 1.1;
            
            # Hỗ trợ WebSockets (cho hot-reload dev mode)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Forward headers cần thiết
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Định tuyến API Backend FastAPI chung (Hỗ trợ cả REST API và WebSocket)
        location /api {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            
            # Hỗ trợ WebSockets (Ví dụ: Classroom Chat WebSocket)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_set_header Host backend;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tăng timeout cho WebSocket kết nối lâu
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 3. Tối ưu hóa đặc biệt cho SSE (Server-Sent Events) - Endpoint của AI Chat Tutor
        # Ngăn chặn Nginx cache/buffer các tin nhắn đang stream của AI
        location /api/v1/chat {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            
            proxy_set_header Host backend;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cấu hình SSE: Tắt buffer để AI stream từng ký tự phản hồi theo thời gian thực
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            
            # Thiết lập thời gian chờ lâu để tránh đứt kết nối khi AI đang xử lý
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location = /api/v1/auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend_servers;
            proxy_set_header Host backend;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
