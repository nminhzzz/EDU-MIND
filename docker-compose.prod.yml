services:
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: always

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod
    container_name: backend_prod
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:?MYSQL_USER is required}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@db:3306/${MYSQL_DATABASE:-learning_db}
      - MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME:?Mongo username is required}:${MONGO_INITDB_ROOT_PASSWORD:?Mongo password is required}@mongodb:27017/chat_db?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
    depends_on:
      - db
      - mongodb
      - redis
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.prod
    container_name: frontend_prod
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

  db:
    image: mysql:8.0
    container_name: mysql_db_prod
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-learning_db}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      - MYSQL_USER=${MYSQL_USER:?MYSQL_USER is required}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    # Khóa cổng 3306 ở prod để tránh bị dò quét database từ bên ngoài
    volumes:
      - db_data_prod:/var/lib/mysql
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:6.0
    container_name: mongodb_chat_prod
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:?Mongo username is required}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:?Mongo password is required}
    volumes:
      - mongo_data_prod:/data/db
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis_cache_prod
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data_prod:/data
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  celery-worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod
    entrypoint: ["celery", "-A", "app.workers.celery_app.celery", "worker", "--loglevel=info", "-Q", "ai_tasks,default"]
    env_file: [.env]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:?MYSQL_USER is required}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@db:3306/${MYSQL_DATABASE:-learning_db}
      - MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME:?Mongo username is required}:${MONGO_INITDB_ROOT_PASSWORD:?Mongo password is required}@mongodb:27017/chat_db?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
    depends_on: [db, mongodb, redis]
    networks: [app-network]
    restart: always

  celery-beat:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod
    entrypoint: ["celery", "-A", "app.workers.celery_app.celery", "beat", "--loglevel=info"]
    env_file: [.env]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:?MYSQL_USER is required}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@db:3306/${MYSQL_DATABASE:-learning_db}
      - MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME:?Mongo username is required}:${MONGO_INITDB_ROOT_PASSWORD:?Mongo password is required}@mongodb:27017/chat_db?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
    depends_on: [redis]
    networks: [app-network]
    restart: always

volumes:
  db_data_prod:
  mongo_data_prod:
  redis_data_prod:
  nginx_logs:

networks:
  app-network:
    driver: bridge
