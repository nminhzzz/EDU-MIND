name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      ENVIRONMENT: development
      DATABASE_URL: mysql+pymysql://user:password@localhost:3306/learning_db
      MONGODB_URL: mongodb://localhost:27017/chat_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci_only_secret_key_ci_only_secret_key_ci_only_secret_key_ci_only_secret_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app tests alembic
      - run: pytest -q
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --omit=dev
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_USER: ci-user
          MYSQL_PASSWORD: ci-password
          MONGO_INITDB_ROOT_USERNAME: ci-mongo
          MONGO_INITDB_ROOT_PASSWORD: ci-mongo-password
          REDIS_PASSWORD: ci-redis-password
          TLS_CERT_PATH: /tmp/tls.crt
          TLS_KEY_PATH: /tmp/tls.key
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod.yml config --quiet
